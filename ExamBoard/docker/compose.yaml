name: kgtestbench-examboard
services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  model-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: qwen2.5:7b-instruct
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for attempt in 1 2 3 4 5; do
        echo "Downloading $${MODEL} (attempt $${attempt}/5)";
        ollama pull "$${MODEL}" && exit 0;
        echo "Download failed; retrying in 15 seconds";
        sleep 15;
        done;
        exit 1
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
volumes:
  ollama-data:
