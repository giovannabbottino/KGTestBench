name: kgtestbench-examboard
services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  model-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3.1:8b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
volumes:
  ollama-data:
