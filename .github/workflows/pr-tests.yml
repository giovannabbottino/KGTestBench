name: KGTestBench PR tests

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/pr-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Run KGTestBench tests with coverage
        run: |
          # Measure project Python modules, excluding communication modules and tests.
          python -m coverage run --branch --source=. --omit="api.py,wikidata.py,wikipedia.py,tests/*" -m unittest discover -s tests -p "test_*.py" -v

      - name: Check coverage
        run: python -m coverage report --show-missing --fail-under=40

      - name: Write coverage summary
        if: always()
        run: |
          echo '## KGTestBench coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --show-missing >> "$GITHUB_STEP_SUMMARY" || true
